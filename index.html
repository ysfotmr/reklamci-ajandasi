<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Reklamcı Ajandası Pro</title>
  
  <!-- iOS & Android Mobil Web App Ayarları -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Reklamcı">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans select-none">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-20">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div>
        <h1 class="text-lg font-bold text-amber-500">📱 Reklamcı Ajandası Pro</h1>
        <p class="text-[10px] text-slate-400">Çoklu Ölçü • Fotoğraflı • Kalıcı Kayıt</p>
      </div>
      <span class="text-[10px] bg-amber-500/20 text-amber-400 px-2.5 py-1 rounded-full font-bold border border-amber-500/30">v2.1</span>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-5">

    <!-- Form -->
    <section class="bg-slate-900 rounded-2xl p-4 border border-slate-800 shadow-xl space-y-4">
      <h2 class="text-sm font-bold text-slate-200 border-b border-slate-800 pb-2">➕ Yeni İş Kaydı</h2>
      
      <form id="jobForm" onsubmit="saveJob(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Müşteri / Firma Adı</label>
          <input type="text" id="customer" required placeholder="Örn: Emmioğlu Restoran" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Telefon</label>
            <input type="tel" id="phone" placeholder="05xx..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">İş Türü</label>
            <input type="text" id="jobTitle" required placeholder="Örn: Cam Folyosu & Tabela" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <!-- Çoklu Ölçü Ekleme Alanı -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-3">
          <div class="flex justify-between items-center">
            <span class="text-xs font-bold text-amber-400">📐 Cam / Parça Ölçüleri (cm)</span>
            <button type="button" onclick="addDimensionRow()" class="text-[11px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-2.5 py-1 rounded-lg font-semibold active:bg-amber-500/40">+ Parça Ekle</button>
          </div>
          
          <div id="dimensionRows" class="space-y-2">
            <!-- Satırlar JS ile eklenecek -->
          </div>

          <div class="text-right text-xs font-extrabold text-amber-400 pt-1 border-t border-slate-800">
            Toplam Alan: <span id="totalSqmResult" class="text-sm">0.00</span> m²
          </div>
        </div>

        <!-- Cephe Fotoğrafı Ekleme -->
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">📷 Cephe / Saha Fotoğrafı</label>
          <input type="file" id="photoInput" accept="image/*" capture="environment" onchange="handlePhotoSelect(event)" class="hidden">
          <div class="flex items-center gap-3">
            <button type="button" onclick="document.getElementById('photoInput').click()" class="bg-slate-800 border border-slate-700 text-xs px-3 py-2.5 rounded-xl font-medium text-slate-200 hover:bg-slate-700 active:bg-slate-600">
              📸 Fotoğraf Çek / Seç
            </button>
            <span id="photoStatus" class="text-xs text-slate-400 italic">Fotoğraf seçilmedi</span>
          </div>
          <img id="photoPreview" class="mt-2 rounded-xl max-h-40 hidden border border-slate-700 object-cover w-full">
        </div>

        <!-- Teklif Fiyatı -->
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Teklif Fiyatı (₺)</label>
          <input type="number" id="price" placeholder="0" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Montaj & Tasarım Notları</label>
          <textarea id="notes" rows="2" placeholder="Zemin rengi, LED rengi, folyo türü vs..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Durum</label>
            <select id="status" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
              <option value="Bekliyor">⏳ Bekliyor</option>
              <option value="Tasarımda">🎨 Tasarımda</option>
              <option value="Baskıda">🖨️ Baskıda</option>
              <option value="Montajda">🔨 Montajda</option>
              <option value="Tamamlandı">✅ Tamamlandı</option>
            </select>
          </div>
          <div>
            <label class="block text-[11px] text-slate-400 mb-1">Teslim Tarihi</label>
            <input type="date" id="deadline" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white">
          </div>
        </div>

        <button type="submit" class="w-full bg-amber-500 active:bg-amber-600 text-slate-950 font-black py-3.5 rounded-xl transition shadow-lg text-sm mt-2">
          💾 İŞİ KAYDET
        </button>
      </form>
    </section>

    <!-- Kayıtlı İşler -->
    <section class="space-y-3">
      <div class="flex justify-between items-center px-1">
        <h2 class="text-sm font-bold text-slate-200">📋 KAYITLI İŞLER</h2>
        <input type="text" id="search" oninput="renderJobs()" placeholder="Arama..." class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white w-36 focus:outline-none focus:border-amber-500">
      </div>

      <div id="jobList" class="space-y-3"></div>
    </section>

  </main>

  <script>
    // Kalıcı Veritabanı Yapısı (IndexedDB)
    let db;
    let currentPhotoBase64 = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("ReklamciAjandasiDB", 1);
        request.onupgradeneeded = (e) => {
          db = e.target.result;
          if (!db.objectStoreNames.contains("jobs")) {
            db.createObjectStore("jobs", { keyPath: "id" });
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e);
      });
    }

    async function getAllJobs() {
      return new Promise((resolve) => {
        const tx = db.transaction("jobs", "readonly");
        const store = tx.objectStore("jobs");
        const req = store.getAll();
        req.onsuccess = () => resolve(req.result.sort((a,b) => b.id - a.id));
      });
    }

    async function saveJobToDB(job) {
      return new Promise((resolve) => {
        const tx = db.transaction("jobs", "readwrite");
        const store = tx.objectStore("jobs");
        store.put(job);
        tx.oncomplete = () => resolve();
      });
    }

    async function deleteJobFromDB(id) {
      return new Promise((resolve) => {
        const tx = db.transaction("jobs", "readwrite");
        const store = tx.objectStore("jobs");
        store.delete(id);
        tx.oncomplete = () => resolve();
      });
    }

    // Ölçü Satırı Yönetimi
    function addDimensionRow(w = '', h = '', q = 1, label = '') {
      const container = document.getElementById('dimensionRows');
      const rowId = Date.now() + Math.random();
      const div = document.createElement('div');
      div.className = "grid grid-cols-12 gap-1.5 items-center dim-row";
      div.dataset.id = rowId;
      div.innerHTML = `
        <input type="text" placeholder="Açıklama (Örn: Ön Cam)" class="col-span-4 dim-label bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white">
        <input type="number" oninput="calculateTotalSqm()" placeholder="En" class="col-span-3 dim-w bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white text-center" value="${w}">
        <input type="number" oninput="calculateTotalSqm()" placeholder="Boy" class="col-span-3 dim-h bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white text-center" value="${h}">
        <input type="number" oninput="calculateTotalSqm()" placeholder="Adet" class="col-span-1 dim-q bg-slate-900 border border-slate-800 rounded-lg p-2 text-xs text-white text-center" value="${q}">
        <button type="button" onclick="this.parentElement.remove(); calculateTotalSqm();" class="col-span-1 text-rose-400 font-bold text-center">✕</button>
      `;
      container.appendChild(div);
      calculateTotalSqm();
    }

    function calculateTotalSqm() {
      const rows = document.querySelectorAll('.dim-row');
      let totalSqm = 0;
      rows.forEach(row => {
        const w = parseFloat(row.querySelector('.dim-w').value) || 0;
        const h = parseFloat(row.querySelector('.dim-h').value) || 0;
        const q = parseFloat(row.querySelector('.dim-q').value) || 1;
        totalSqm += (w * h * q) / 10000;
      });
      document.getElementById('totalSqmResult').innerText = totalSqm.toFixed(2);
      return totalSqm.toFixed(2);
    }

    function handlePhotoSelect(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          currentPhotoBase64 = evt.target.result;
          document.getElementById('photoPreview').src = currentPhotoBase64;
          document.getElementById('photoPreview').classList.remove('hidden');
          document.getElementById('photoStatus').innerText = "Fotoğraf eklendi";
        };
        reader.readAsDataURL(file);
      }
    }

    async function saveJob(e) {
      e.preventDefault();
      
      const rows = document.querySelectorAll('.dim-row');
      const dimensions = [];
      rows.forEach(row => {
        dimensions.push({
          label: row.querySelector('.dim-label').value || 'Parça',
          w: parseFloat(row.querySelector('.dim-w').value) || 0,
          h: parseFloat(row.querySelector('.dim-h').value) || 0,
          q: parseFloat(row.querySelector('.dim-q').value) || 1
        });
      });

      const newJob = {
        id: Date.now(),
        customer: document.getElementById('customer').value,
        phone: document.getElementById('phone').value,
        jobTitle: document.getElementById('jobTitle').value,
        dimensions: dimensions,
        totalSqm: calculateTotalSqm(),
        price: document.getElementById('price').value,
        notes: document.getElementById('notes').value,
        status: document.getElementById('status').value,
        deadline: document.getElementById('deadline').value,
        photo: currentPhotoBase64
      };

      await saveJobToDB(newJob);
      
      // Sıfırla
      document.getElementById('jobForm').reset();
      document.getElementById('dimensionRows').innerHTML = '';
      addDimensionRow();
      currentPhotoBase64 = null;
      document.getElementById('photoPreview').classList.add('hidden');
      document.getElementById('photoStatus').innerText = "Fotoğraf seçilmedi";
      document.getElementById('totalSqmResult').innerText = "0.00";

      renderJobs();
    }

    async function deleteJob(id) {
      if (confirm('Bu kayıt silinsin mi?')) {
        await deleteJobFromDB(id);
        renderJobs();
      }
    }

    async function renderJobs() {
      const jobs = await getAllJobs();
      const query = document.getElementById('search').value.toLowerCase();
      const listContainer = document.getElementById('jobList');
      listContainer.innerHTML = '';

      const filtered = jobs.filter(j => 
        j.customer.toLowerCase().includes(query) || 
        j.jobTitle.toLowerCase().includes(query)
      );

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="text-center py-8 text-slate-600 text-xs">Kayıtlı iş bulunamadı.</div>`;
        return;
      }

      filtered.forEach(job => {
        const statusColors = {
          'Bekliyor': 'bg-slate-800 text-slate-300 border-slate-700',
          'Tasarımda': 'bg-purple-950/50 text-purple-300 border-purple-800',
          'Baskıda': 'bg-blue-950/50 text-blue-300 border-blue-800',
          'Montajda': 'bg-amber-950/50 text-amber-300 border-amber-800',
          'Tamamlandı': 'bg-emerald-950/50 text-emerald-300 border-emerald-800'
        };

        let dimHTML = job.dimensions.map(d => 
          `<div class="flex justify-between text-[11px] text-slate-300 border-b border-slate-800/40 py-1">
             <span>${d.label}: ${d.w}x${d.h} cm (${d.q} Adet)</span>
             <span class="font-bold text-amber-400">${((d.w*d.h*d.q)/10000).toFixed(2)} m²</span>
           </div>`
        ).join('');

        const card = document.createElement('div');
        card.className = "bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-3 shadow-lg relative";
        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <h3 class="font-bold text-white text-base">${job.customer}</h3>
              <p class="text-xs text-amber-400 font-semibold">${job.jobTitle}</p>
            </div>
            <span class="text-[10px] font-bold px-2.5 py-1 rounded-full border ${statusColors[job.status] || 'bg-slate-800'}">
              ${job.status}
            </span>
          </div>

          ${job.phone ? `<div class="text-xs text-slate-400">📞 <a href="tel:${job.phone}" class="underline">${job.phone}</a></div>` : ''}

          <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800/80 space-y-1">
            <div class="text-[10px] text-slate-500 font-bold mb-1">PARÇA ÖLÇÜLERİ</div>
            ${dimHTML}
            <div class="text-right font-black text-amber-400 text-xs pt-1">Toplam: ${job.totalSqm} m²</div>
          </div>

          ${job.photo ? `<img src="${job.photo}" class="w-full h-36 object-cover rounded-xl border border-slate-800">` : ''}

          <div class="flex justify-between items-center text-xs text-slate-300 bg-slate-950/50 p-2 rounded-xl">
            <span>💰 Teklif: <strong class="text-emerald-400">${job.price || 0} ₺</strong></span>
            <span>📅 ${job.deadline || 'Tarih yok'}</span>
          </div>

          ${job.notes ? `<p class="text-xs text-slate-400 bg-slate-950/50 p-2.5 rounded-xl border border-slate-800/50 italic">"${job.notes}"</p>` : ''}

          <div class="flex justify-end pt-1">
            <button onclick="deleteJob(${job.id})" class="text-xs text-rose-400 font-semibold px-2 py-1">Kayıt Sil</button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Uygulama Başlatma
    window.onload = async () => {
      await initDB();
      addDimensionRow();
      renderJobs();
    };
  </script>
</body>
</html>
